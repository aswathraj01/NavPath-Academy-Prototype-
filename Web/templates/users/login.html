{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NavPath Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navpath: {
                            blue: '#06234a',
                            accent: '#1769e8',
                            light: '#f4f8fe',
                            textDark: '#13213b',
                            textGray: '#667085'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#eef5fd] min-h-screen font-sans flex items-center justify-center">

<div class="flex w-full h-screen">
    <!-- Left Side: Hero Area -->
    <div class="hidden lg:flex flex-col items-center justify-center w-1/2 bg-[#0a2e61] text-white">
        <span class="text-[120px] text-[#d7e9ff] mb-8 leading-none">⚓</span>
        <h1 class="text-4xl font-bold text-center px-12">Learn. Prepare. Succeed.</h1>
    </div>

    <!-- Right Side: Auth Form -->
    <div class="flex flex-col items-center justify-center w-full lg:w-1/2 bg-[#f4f8fe] relative">
        <a href="javascript:history.back()" class="absolute top-8 right-8 flex items-center gap-2 text-navpath-textGray hover:text-navpath-accent transition-colors font-semibold text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Back
        </a>
        <div class="w-full max-w-md bg-white p-10 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center">
            
            <!-- Logo -->
            <a href="/" class="flex items-center gap-2 mb-8">
                <img src="{% static 'Navpath_Final_Logo_lyst1774330667080-removebg-preview.png' %}" alt="NavPath Academy Logo" class="h-10">
                <div class="flex flex-col">
                    <span class="font-bold text-navpath-blue text-xs leading-none">NAVPATH</span>
                    <span class="font-semibold text-gray-500 text-[9px] leading-none tracking-widest mt-[2px]">ACADEMY</span>
                </div>
            </a>

            <div class="w-full text-center mb-8">
                <h2 class="text-2xl font-bold text-navpath-textDark mb-2">Welcome Back!</h2>
                <p class="text-sm text-navpath-textGray">Login to continue your learning journey</p>
            </div>

            <form class="w-full space-y-5" method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="flex flex-col gap-1">
                    <label class="font-semibold text-sm text-navpath-textDark">Email</label>
                    <input type="text" name="username" placeholder="Enter your email" required class="w-full h-12 px-4 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-navpath-accent focus:ring-1 focus:ring-navpath-accent">
                </div>
                
                <div class="flex flex-col gap-1">
                    <label class="font-semibold text-sm text-navpath-textDark">Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required class="w-full h-12 px-4 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-navpath-accent focus:ring-1 focus:ring-navpath-accent">
                </div>
                
                <button type="submit" class="w-full h-12 bg-navpath-accent text-white font-bold rounded-lg hover:bg-blue-700 transition-colors mt-4">
                    Login
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-sm text-navpath-textGray">Don't have an account? <a href="{% url 'register' %}" class="text-navpath-accent font-semibold hover:underline">Sign Up</a></p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
